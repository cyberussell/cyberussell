name: Supabase Keep-Alive

# Pings the main site and Territory Management System Supabase projects daily
# so the free-tier auto-pause (inactivity) never triggers. No table data is read or written.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping main site Supabase project
        run: |
          curl -sf -o /dev/null -w "main site: %{http_code}\n" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/"

      - name: Ping Territory Management System Supabase project
        run: |
          curl -sf -o /dev/null -w "TMS: %{http_code}\n" \
            -H "apikey: ${{ secrets.TMS_SUPABASE_ANON_KEY }}" \
            "${{ secrets.TMS_SUPABASE_URL }}/rest/v1/"
