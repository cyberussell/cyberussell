name: Submit sitemap to Google Search Console

# PHASE 2 (current): runs automatically after a successful PRODUCTION
# deployment, and can still be triggered manually via `workflow_dispatch`.
# Vercel's GitHub integration posts a `deployment_status` event
# (state: "success") when a deployment finishes; gating on
# environment == "Production" keeps preview/branch deploys from ever
# triggering a submission. A manual run (Phase 1) already succeeded,
# confirming the Environment + secret + submission work end-to-end.
# See docs/gsc-sitemap-submission.md.
on:
  deployment_status:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  submit-sitemap:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    # A GitHub Environment gates access to the encrypted secret below and
    # can additionally require reviewer approval or restrict which
    # branches may use it (Settings → Environments → Production; GitHub
    # environment name matching is case-insensitive, so "production" here
    # correctly resolves to the "Production" environment).
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Submit sitemap index to Google Search Console
        env:
          GSC_SERVICE_ACCOUNT_KEY_B64: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY_B64 }}
        run: node scripts/submit-sitemap-to-gsc.js
